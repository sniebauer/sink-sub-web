<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>SinkSub</title>
    <style>
      @font-face {
        font-family: 'W95FA';
        src: url('/w95fa.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
      }
      html, body {
        margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      }
      #app { height: 100%; display: flex; flex-direction: column; }
      /* Game sits at the top; on touch devices the control bar takes the bottom. */
      #stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: flex-start; justify-content: center; overflow: hidden; }
      #game { image-rendering: pixelated; max-width: 100%; max-height: 100%; width: auto; height: auto; touch-action: none; display: block; }

      #controls { display: none; }
      @media (pointer: coarse) {
        #controls {
          display: flex; align-items: stretch; justify-content: space-between; gap: 10px;
          flex: 0 0 auto; padding: 10px calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
          background: #c0c0c0; box-shadow: inset 0 2px 0 #fff, inset 0 -1px 0 #808080;
        }
        .pad { display: flex; gap: 10px; }
        .btn {
          font-family: 'W95FA', sans-serif; color: #000; background: #c0c0c0; border: 0;
          min-width: 68px; height: 78px; font-size: 24px; line-height: 1; cursor: pointer;
          touch-action: none; -webkit-user-select: none; user-select: none;
          box-shadow: inset -2px -2px 0 #808080, inset 2px 2px 0 #fff, inset -3px -3px 0 #0a0a0a, inset 3px 3px 0 #dfdfdf;
        }
        .btn:active { box-shadow: inset 2px 2px 0 #808080, inset -2px -2px 0 #fff, inset 3px 3px 0 #0a0a0a; }
        .btn.fire { min-width: 92px; font-size: 14px; font-weight: bold; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage"><canvas id="game" width="640" height="476"></canvas></div>
      <div id="controls">
        <div class="pad">
          <button class="btn" id="btn-left" aria-label="Move left">◀</button>
          <button class="btn" id="btn-right" aria-label="Move right">▶</button>
        </div>
        <div class="pad">
          <button class="btn fire" id="btn-bl" aria-label="Bomb left">BOMB◀</button>
          <button class="btn fire" id="btn-br" aria-label="Bomb right">▶BOMB</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
